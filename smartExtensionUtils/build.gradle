plugins {
    id 'com.android.library'
}

android {
    namespace 'com.sonyericsson.extras.liveware.extension.util'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':smartExtensionAPI')
}
